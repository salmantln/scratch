[package]
name = "quietnote"
version = "0.1.0"
description = "A local-first, bot-free meeting workspace"
license = "AGPL-3.0-only"
authors = ["QuietNote contributors", "Eric Li (Scratch)"]
edition = "2021"

[lib]
name = "scratch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
notify = "6"
tantivy = "0.22"
tokio = { version = "1", features = ["fs", "sync", "time"] }
base64 = "0.22"
url = "2"
urlencoding = "2"
open = "5"
regex = "1"
walkdir = "2"
tauri-plugin-single-instance = "2"
chrono = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
sha2 = "0.10"
getrandom = "0.3"
# Recordings are encrypted with AES-256-GCM (sealed.rs).
ring = "0.17"
toml_edit = "0.25"
# Deleting a meeting moves its folder to the Trash (meetings.rs).
trash = "5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSUserDefaults", "NSString", "NSArray", "NSDictionary", "NSValue", "NSUUID", "NSDate", "NSError", "NSPredicate", "NSURL", "NSAppleEventManager", "NSAppleEventDescriptor"] }
keyring = { version = "3", features = ["apple-native"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["objc2-core-graphics"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
block2 = "0.6"
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-foundation"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFDictionary", "CFBundle", "CFString", "CFURL"] }
sherpa-onnx = "1.13"
objc2-application-services = "0.3"
objc2-event-kit = "0.3"
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }

# Local recording and transcription (macOS and Windows only; Linux keeps the prototype capture).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
cpal = "0.18"
hound = "3.5"
rubato = "5"
fs4 = "0.8"
sonora = "0.2"
sonora-aec3 = "0.2"
# Start recording from any app (hotkey.rs).
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "macos")'.dependencies.whisper-rs]
version = "0.16"
features = ["metal"]

[target.'cfg(target_os = "windows")'.dependencies.whisper-rs]
version = "0.16"
