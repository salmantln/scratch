name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

  # Recording and transcription are only built on macOS and Windows; check and test them on macOS.
  check-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # The Apple Intelligence helper needs an SDK with FoundationModels (Xcode 26 or later).
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Cache speech models
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/models
          key: models-${{ hashFiles('scripts/fetch-models.mjs') }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch speech models
        run: npm run models

      - name: Build frontend
        run: npm run build

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo test
        working-directory: src-tauri
        env:
          QUIETNOTE_REQUIRE_APPLE_AI: "1"
        run: cargo test

      # Built with Apple Intelligence, and still starts on Macs without FoundationModels (weakly linked).
      - name: Check the Apple Intelligence helper
        working-directory: src-tauri
        run: |
          echo '{"op":"status"}' | target/debug/quietnote-ai | grep -q '"built":true'
          otool -l target/debug/quietnote-ai | grep -A2 LC_LOAD_WEAK_DYLIB | grep -q FoundationModels
